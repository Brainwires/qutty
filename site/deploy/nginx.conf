# qutty.org: the nginx:alpine container `qutty-site` on biscuits (127.0.0.1:5710, behind the
# Cloudflare tunnel) serves ~/qutty.org read-only from /usr/share/nginx/html with this file as its
# config (~/qutty.org.nginx.conf). This copy is the source of truth: `deno task deploy`
# (scripts/deploy.sh) copies it there and reloads nginx. Modelled on docs.denext.dev's.

# Content negotiation: an agent asking for Markdown (Accept: text/markdown) gets the page's .md twin.
map $http_accept $qutty_wants_md {
  default 0;
  "~*text/markdown" 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No caching, anywhere: the site is tiny and static-exported, so we serve
  # every response fresh from origin. `no-store` tells browsers AND Cloudflare not
  # to cache (Cloudflare honors origin Cache-Control), so an edited page or
  # stylesheet is live the instant it is rsynced — no 7-day edge-cache surprises.
  add_header Cache-Control "no-store" always;
  add_header Vary "Accept" always;

  location / {
    # The site's own not-found page (out/404.html, written by scripts/seo.ts). It is set
    # here, not on the server: a location's error_page replaces the server's.
    error_page 404 /404.html;
    error_page 418 = @markdown;
    if ($qutty_wants_md) { return 418; }
    try_files $uri $uri/index.html $uri/ =404;
  }

  # /docs/x with Accept: text/markdown -> /docs/x.md (or /docs/x/index.md).
  location @markdown {
    types { }
    default_type "text/markdown; charset=utf-8";
    add_header Cache-Control "no-store" always;
    add_header Vary "Accept" always;
    try_files $uri.md $uri/index.md $uri =404;
  }

  # A direct .md URL is Markdown, not a download.
  location ~* \.md$ {
    types { }
    default_type "text/markdown; charset=utf-8";
    add_header Cache-Control "no-store" always;
    add_header Vary "Accept" always;
    try_files $uri =404;
  }
}
