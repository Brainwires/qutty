name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Denext's desktop runtime is built for this exact Deno version.
  DENO_VERSION: 2.9.8
  FALLOW_VERSION: 3.20.0

jobs:
  # Each job's runner: our self-hosted pool while it has a free slot, else the GitHub image at
  # once (fork pull requests: GitHub only). Each fallback after `||` is that job's GitHub image,
  # so a failed pick still runs everything.
  runners:
    name: pick runners
    runs-on: ubuntu-latest # GitHub's image: the pick must not wait in the queue it shortens
    timeout-minutes: 5
    permissions:
      actions: read # the repository's queued / running jobs
    outputs:
      plan: ${{ steps.pick.outputs.plan }}
    steps:
      - id: pick
        uses: Brainwires/.github/actions/pick-runners@b22319621b56184a647fddfdcbefa300bcb6efc5 # pick-runners
        with:
          jobs: >-
            checks=macos-arm64@macos-15 test_arm64=macos-arm64@macos-15
            test_x86_64=macos-x64@macos-15-intel test_linux=linux-x64@ubuntu-24.04
            e2e=macos-arm64@macos-15
          vars: ${{ toJSON(vars) }}

  checks:
    name: Lint, types, fallow
    needs: runners
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}').checks || 'macos-15' }}
    # A hang fails in minutes, not at GitHub's 6 h job limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true
      - run: deno fmt --check
      - run: deno lint
      # desktop.ts imports .deno-desktop/config.json, which the export generates.
      - run: deno task export
      - run: deno task check
      - name: fallow (dead code, duplication, health)
        run: |
          npm install -g "fallow@${FALLOW_VERSION}"
          fallow dead-code -q --format github-annotations
          fallow dupes -q
          fallow health -q --min-score 85 --format github-summary >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Unit tests (${{ matrix.arch }})
    needs: runners
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, pick: test_arm64, os: macos-15 }
          - { arch: x86_64, pick: test_x86_64, os: macos-15-intel }
          - { arch: linux-x86_64, pick: test_linux, os: ubuntu-24.04 }
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}')[matrix.pick] || matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true
      - run: deno task test

  e2e:
    name: End-to-end (Chromium)
    needs: runners
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}').e2e || 'macos-15' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true
      - run: deno task test:e2e
        env:
          E2E_TIMEOUT_SCALE: "3"
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: tests/e2e/__screenshots__/
          if-no-files-found: ignore
