name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Denext's desktop runtime is built for this exact Deno version.
  DENO_VERSION: 2.9.8
  FALLOW_VERSION: 3.20.0

jobs:
  checks:
    name: Lint, types, fallow
    runs-on: ${{ github.event_name != 'pull_request' && vars.RUNNER_MACOS_ARM && fromJSON(vars.RUNNER_MACOS_ARM) || 'macos-15' }}
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true
      - run: deno fmt --check
      - run: deno lint
      # desktop.ts imports .deno-desktop/config.json, which the export generates.
      - run: deno task export
      - run: deno task check
      - name: fallow (dead code, duplication, health)
        run: |
          npm install -g "fallow@${FALLOW_VERSION}"
          fallow dead-code -q --format github-annotations
          fallow dupes -q
          fallow health -q --min-score 85 --format github-summary >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Unit tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ github.event_name != 'pull_request' && vars.RUNNER_MACOS_ARM && fromJSON(vars.RUNNER_MACOS_ARM) || 'macos-15' }}
            arch: arm64
          - runner: ${{ github.event_name != 'pull_request' && vars.RUNNER_MACOS_X64 && fromJSON(vars.RUNNER_MACOS_X64) || 'macos-15-intel' }}
            arch: x86_64
          # The self-hosted Linux runner RUNNER_LINUX_X64 names, else ubuntu-24.04 (always the image on a fork's pull_request / pull_request_target).
          - runner: ${{ fromJSON((startsWith(github.event_name, 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)) && '"ubuntu-24.04"' || (startsWith(vars.RUNNER_LINUX_X64, '[') && vars.RUNNER_LINUX_X64 || format('"{0}"', vars.RUNNER_LINUX_X64 || 'ubuntu-24.04'))) }}
            arch: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true
      # node-pty has no Linux prebuilds: compile pty.node (runner has node, python3, make, g++).
      - if: runner.os == 'Linux'
        run: sh scripts/build-node-pty-linux.sh
      - run: deno task test

  e2e:
    name: End-to-end (Chromium)
    runs-on: ${{ github.event_name != 'pull_request' && vars.RUNNER_MACOS_ARM && fromJSON(vars.RUNNER_MACOS_ARM) || 'macos-15' }}
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true
      - run: deno task test:e2e
        env:
          E2E_TIMEOUT_SCALE: "3"
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/__screenshots__/
          if-no-files-found: ignore
