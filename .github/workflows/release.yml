name: Release

# Push a tag like v0.2.0 (matching deno.json's version) to build, sign and notarize the arm64 and
# x86_64 apps, build the Linux packages (AppImage, .deb, tarball) for x86_64 and arm64, and
# publish a GitHub release with them, their SHA-256 files and the CHANGELOG.md section.
# A tag with a pre-release suffix (v0.2.0-beta.1) is published as a pre-release.
#
# The Linux packages are best-effort: the release waits for them, but a Linux failure does not
# hold back the macOS apps (a tag is never moved or reused, so a failed release costs a version).
# Re-run the failed Linux job and the release job re-runs after it and adds the Linux files to
# the published release.
#
# Dry runs, which build and check the Linux packages and publish nothing (no macOS build, no
# release): a pull request that touches the Linux packaging, and workflow_dispatch.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-linux.ts
      - scripts/build-audio-lib.ts
      - denext.config.ts
  workflow_dispatch:

permissions:
  contents: read

env:
  DENO_VERSION: 2.9.8
  # The Rullama commit whose `rullama-audio-ffi` (the voice audio library, bundled through
  # desktop.bundle.libraries) each build compiles. No release tag has the crate yet (it landed
  # after v0.12.0): move to a tag once one does. Its rust-toolchain.toml pins Rust 1.91.
  RULLAMA_REPO: https://github.com/Brainwires/rullama-framework.git
  RULLAMA_REF: 1bf343c7ac52eef35635299f8576412e1b7cf976

jobs:
  # Each job's runner: our self-hosted pool while it has a free slot, else the GitHub image at
  # once (fork pull requests: GitHub only). Each fallback after `||` is that job's GitHub image,
  # so a failed pick still runs everything. Signing and notarization work on GitHub's macOS
  # images too (the job builds its own keychain; v0.1.0 was signed there).
  runners:
    name: pick runners
    runs-on: ubuntu-latest # GitHub's image: the pick must not wait in the queue it shortens
    timeout-minutes: 5
    permissions:
      actions: read # the repository's queued / running jobs
    outputs:
      plan: ${{ steps.pick.outputs.plan }}
    steps:
      - id: pick
        uses: Brainwires/.github/actions/pick-runners@8a0cb356b969132668442f9539b75d3173d59b3e # pick-runners (ETA overflow)
        with:
          # Only the jobs this run has: the macOS builds and the release on a tag.
          jobs: >-
            ${{ github.event_name == 'push'
            && 'build_arm64=macos-arm64@macos-15 build_x86_64=macos-x64@macos-15-intel linux_x86_64=linux-x64@ubuntu-24.04 release=linux-x64@ubuntu-latest'
            || 'linux_x86_64=linux-x64@ubuntu-24.04' }}
          vars: ${{ toJSON(vars) }}

  build:
    name: Build ${{ matrix.arch }}
    needs: runners
    # Tags only: signing and notarization need the release secrets.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, pick: build_arm64, os: macos-15 }
          - { arch: x86_64, pick: build_x86_64, os: macos-15-intel }
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}')[matrix.pick] || matrix.os }}
    # Tests, build, signing and notarization; a hang fails here, not at GitHub's 6 h limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true

      - name: Check the tag matches deno.json's version
        id: version
        run: |
          VERSION="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match deno.json version ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - run: deno task test

      # The voice audio library, built for this arch into native/darwin-<arch>/, where the package
      # script copies it into Contents/Frameworks and signs it with the app. The library is
      # optional to the packager, so a failed build here fails the job rather than shipping an
      # app without it.
      - name: Check out Rullama (the audio library's source)
        run: |
          set -eu
          # Outside the workspace (so Qutty's own tasks never see it), fresh each job.
          RULLAMA_DIR="$RUNNER_TEMP/rullama-framework"
          rm -rf "$RULLAMA_DIR"
          echo "RULLAMA_DIR=$RULLAMA_DIR" >> "$GITHUB_ENV"
          git init -q "$RULLAMA_DIR"
          git -C "$RULLAMA_DIR" fetch -q --depth 1 "$RULLAMA_REPO" "$RULLAMA_REF"
          git -C "$RULLAMA_DIR" checkout -q FETCH_HEAD
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.RULLAMA_DIR }} -> target
          key: rullama-audio-ffi
      - name: Build the audio library (rullama-audio-ffi)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          # whisper-rs builds whisper.cpp with cmake: GitHub's images have it, a self-hosted
          # runner may not.
          command -v cmake > /dev/null || brew install cmake
          deno task audio:lib --native
          LIB="native/darwin-${ARCH/x86_64/x64}/librullama_audio_ffi.dylib"
          lipo -archs "$LIB" | tee /dev/stderr | grep -qw "$ARCH"

      - name: Import the signing certificate and notary key
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          # Default + first in the search list, so codesign and notarytool's keychain profile find it.
          security default-keychain -s "$KEYCHAIN"
          # The existing keychains, one argument each (word splitting intended).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # The Developer ID G2 intermediate that issued our certificate. GitHub's images ship it;
          # a plain macOS install (a self-hosted runner) may only have G1, and then the identity
          # is not valid for codesigning. Pinned by fingerprint.
          curl -fsSL --retry 3 https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          G2_SHA256="$(openssl x509 -inform DER -in "$RUNNER_TEMP/DeveloperIDG2CA.cer" -noout \
            -fingerprint -sha256 | sed 's/.*=//; s/://g')"
          [ "$G2_SHA256" = "F16CD3C54C7F83CEA4BF1A3E6A0819C8AAA8E4A1528FD144715F350643D2DF3A" ] \
            || { echo "::error::Unexpected Developer ID G2 CA fingerprint: $G2_SHA256"; exit 1; }
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"

          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" > /dev/null

          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials qutty-ci --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)"
          [ -n "$IDENTITY" ] || { echo "::error::No Developer ID Application identity imported"; exit 1; }
          echo "DENEXT_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "DENEXT_NOTARY_PROFILE=qutty-ci" >> "$GITHUB_ENV"

      - name: Package (sign, notarize, staple)
        run: deno task desktop:package

      - name: Verify and name the artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          codesign --verify --deep --strict "dist/Qutty.app"
          spctl -a -t exec -vv "dist/Qutty.app"
          xcrun stapler validate "dist/Qutty.app"
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' dist/Qutty.app/Contents/Info.plist)"
          lipo -archs "dist/Qutty.app/Contents/MacOS/$EXE" | tee /dev/stderr | grep -qw "$ARCH"
          # The audio library: bundled, signed with the app's identity, for this arch.
          AUDIO="dist/Qutty.app/Contents/Frameworks/librullama_audio_ffi.dylib"
          codesign --verify --strict -vv "$AUDIO"
          lipo -archs "$AUDIO" | tee /dev/stderr | grep -qw "$ARCH"
          mkdir -p release
          cp "dist/Qutty.dmg" "release/Qutty-${VERSION}-${ARCH}.dmg"
          (cd release && shasum -a 256 "Qutty-${VERSION}-${ARCH}.dmg" > "Qutty-${VERSION}-${ARCH}.dmg.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: qutty-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  linux:
    name: Build Linux ${{ matrix.arch }}
    needs: runners
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 picked (our linux-x64 pool, else ubuntu-24.04); arm64 natively on GitHub's Arm
        # image (no `pick`, so the plan has no entry for it).
        include:
          - pick: linux_x86_64
            os: ubuntu-24.04
            arch: x86_64
            label: x64
            tool: x86_64
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          - os: ubuntu-24.04-arm
            arch: arm64
            label: arm64
            tool: aarch64
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
    runs-on: ${{ matrix.pick && fromJSON(needs.runners.outputs.plan || '{}')[matrix.pick] || matrix.os }}
    # Tests, the packages and their self-tests; a hang fails here, not at 6 h.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true

      - name: Version
        id: version
        run: |
          VERSION="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match deno.json version ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install the packaging tools and the window's runtime (for the self-test)
        env:
          TOOL: ${{ matrix.tool }}
          TOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-0 libgtk-3-0 xvfb xauth desktop-file-utils
          # The audio library's build: whisper.cpp (cmake, a C/C++ compiler, libclang for
          # bindgen) and cpal's ALSA headers.
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config libasound2-dev
          # appimagetool, pinned by hash, run without FUSE by a wrapper. The AppImage runtime it
          # embeds is denext's pin (type2-runtime 20251108, SHA-256-checked by the package script
          # and passed as --runtime-file).
          BIN="$RUNNER_TEMP/bin"
          mkdir -p "$BIN"
          curl -fsSL --retry 3 -o "$BIN/appimagetool.AppImage" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${TOOL}.AppImage"
          echo "${TOOL_SHA256}  $BIN/appimagetool.AppImage" | sha256sum -c -
          chmod +x "$BIN/appimagetool.AppImage"
          printf '#!/bin/sh\nexec "%s/appimagetool.AppImage" --appimage-extract-and-run "$@"\n' \
            "$BIN" > "$BIN/appimagetool"
          chmod +x "$BIN/appimagetool"
          echo "$BIN" >> "$GITHUB_PATH"

      - if: github.event_name == 'push'
        run: deno task test

      # The voice audio library, built into native/linux-<label>/, where the package script copies
      # it into the bundle's lib/. Optional to the packager, so a failed build fails the job here.
      - name: Check out Rullama (the audio library's source)
        run: |
          set -eu
          # Outside the workspace (so Qutty's own tasks never see it), fresh each job.
          RULLAMA_DIR="$RUNNER_TEMP/rullama-framework"
          rm -rf "$RULLAMA_DIR"
          echo "RULLAMA_DIR=$RULLAMA_DIR" >> "$GITHUB_ENV"
          git init -q "$RULLAMA_DIR"
          git -C "$RULLAMA_DIR" fetch -q --depth 1 "$RULLAMA_REPO" "$RULLAMA_REF"
          git -C "$RULLAMA_DIR" checkout -q FETCH_HEAD
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.RULLAMA_DIR }} -> target
          key: rullama-audio-ffi
      - name: Build the audio library (rullama-audio-ffi)
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          deno task audio:lib --native
          test -s "native/linux-${LABEL}/librullama_audio_ffi.so"
          ls -la "native/linux-${LABEL}"

      - name: Package (AppImage, .deb, tarball)
        run: deno task desktop:package:linux --format tar.gz,deb,appimage

      - name: Check the packages and run the PTY self-test from each
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          ID=org.qutty.Qutty
          # The launcher each package carries (denext writes them from denext.config.ts
          # desktop.linux.desktopEntry): valid, named Qutty, listed with the terminals, its icon
          # installed beside it.
          check_entry() {
            echo "--- $1"
            cat "$1"
            desktop-file-validate "$1"
            grep -qx 'Name=Qutty' "$1"
            grep -qx "Icon=${ID}" "$1"
            grep -qx 'Categories=System;TerminalEmulator;' "$1"
            grep -qx 'GenericName=Terminal' "$1"
            grep -qx "StartupWMClass=${ID}" "$1"
          }
          # The AppStream metainfo the .deb and the AppImage install.
          check_metainfo() {
            echo "--- $1"
            cat "$1"
            grep -q "<id>${ID}</id>" "$1"
            grep -q "<launchable type=\"desktop-id\">${ID}.desktop</launchable>" "$1"
          }
          echo "::group::.deb"
          dpkg-deb -I "dist/Qutty-${LABEL}.deb"
          dpkg-deb -c "dist/Qutty-${LABEL}.deb" | grep -v ' \./usr/lib/'
          dpkg-deb -c "dist/Qutty-${LABEL}.deb" | grep '/librullama_audio_ffi\.so$'
          dpkg-deb -f "dist/Qutty-${LABEL}.deb" Maintainer | grep -qxF 'Brainwires <155631428+Brainwires@users.noreply.github.com>'
          DEB="$RUNNER_TEMP/deb"
          dpkg-deb -x "dist/Qutty-${LABEL}.deb" "$DEB"
          check_entry "$DEB/usr/share/applications/${ID}.desktop"
          check_metainfo "$DEB/usr/share/metainfo/${ID}.metainfo.xml"
          test -f "$DEB/usr/share/icons/hicolor/512x512/apps/${ID}.png"
          echo "::endgroup::"
          echo "::group::tarball"
          TGZ="$RUNNER_TEMP/tgz"
          mkdir -p "$TGZ"
          tar -xzf "dist/Qutty-${LABEL}-linux.tar.gz" -C "$TGZ"
          find "$TGZ" -name librullama_audio_ffi.so | grep .
          check_entry "$TGZ/Qutty-${LABEL}/${ID}.desktop"
          test -f "$TGZ/Qutty-${LABEL}/${ID}.png"
          echo "::endgroup::"
          echo "::group::AppImage contents"
          chmod +x "dist/Qutty-${LABEL}.AppImage"
          APPDIR="$RUNNER_TEMP/appimage"
          mkdir -p "$APPDIR"
          (cd "$APPDIR" && "$GITHUB_WORKSPACE/dist/Qutty-${LABEL}.AppImage" --appimage-extract > /dev/null)
          ls -la "$APPDIR/squashfs-root"
          find "$APPDIR/squashfs-root" -name librullama_audio_ffi.so | grep .
          check_entry "$APPDIR/squashfs-root/${ID}.desktop"
          check_metainfo "$APPDIR/squashfs-root/usr/share/metainfo/${ID}.metainfo.xml"
          grep -q 'libwebkit2gtk-4.1' "$APPDIR/squashfs-root/usr/share/metainfo/${ID}.metainfo.xml"
          test -f "$APPDIR/squashfs-root/.DirIcon"
          cat "$APPDIR/squashfs-root/AppRun"
          grep -q "LAUFEY_APP_ID:-${ID}" "$APPDIR/squashfs-root/AppRun"
          echo "::endgroup::"
          sudo apt-get install -y -qq "./dist/Qutty-${LABEL}.deb"
          # Start a login shell through Deno.openPty, have it answer, exit 0 (desktop/pty.ts),
          # under a throwaway HOME and a virtual display.
          selftest() {
            HOME="$(mktemp -d)" QUTTY_PTY_SELFTEST=1 timeout 180 xvfb-run -a "$@" 2>&1 \
              | tee "$RUNNER_TEMP/selftest.log"
            grep -q '^pty self-test: OK$' "$RUNNER_TEMP/selftest.log"
          }
          echo "::group::.deb: /usr/bin/qutty"
          selftest qutty
          echo "::endgroup::"
          echo "::group::AppImage"
          selftest "dist/Qutty-${LABEL}.AppImage" --appimage-extract-and-run
          echo "::endgroup::"

      - name: Name the artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          mkdir -p release
          cp "dist/Qutty-${LABEL}.AppImage" "release/Qutty-${VERSION}-${ARCH}.AppImage"
          cp "dist/Qutty-${LABEL}.deb" "release/Qutty-${VERSION}-${ARCH}.deb"
          cp "dist/Qutty-${LABEL}-linux.tar.gz" "release/Qutty-${VERSION}-${ARCH}-linux.tar.gz"
          cd release
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: qutty-linux-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
          # A dry run's packages are for inspection only.
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}

  release:
    name: Publish GitHub release
    needs: [runners, build, linux]
    # Tags only, once both macOS apps are built; Linux is best-effort (see the top).
    if: always() && github.event_name == 'push' && needs.build.result == 'success'
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}').release || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX: ${{ needs.linux.result }}
        run: |
          set -eu
          if [ "$LINUX" != success ]; then
            echo "::warning::The Linux packages failed ($LINUX); publishing the macOS apps alone. Re-run the failed Linux job to add them."
          fi
          # A re-run (after a failed Linux job): the release exists, so add the files to it.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # This version's CHANGELOG.md section, up to the next "## " heading.
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Qutty ${VERSION}" > notes.md
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; *) PRE="--latest" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* $PRE \
            --title "Qutty ${VERSION}" --notes-file notes.md
